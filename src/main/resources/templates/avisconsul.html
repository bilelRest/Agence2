<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="template">
<head>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.10.5/font/bootstrap-icons.css">
    <script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <title>Consultation avis</title>
</head>
<body>
<div layout:fragment="content1">
    <div class="card my-4">
        <div class="card-header bg-info">
            <h1 class="text-left text-light">Consultation avis</h1>
        </div>

        <div class="card-body ">
            <form th:action="@{avisconsul}" method="get" class="row g-3 align-items-center">
                <div class="col-auto">
                    <label for="colis" class="form-label">Saisir le N° du colis ou N° bloc</label>
                </div>
                <div class="col-auto">
                    <input required id="colis" type="text" name="colis" class="form-control">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-success">Rechercher</button>
                </div>
            </form>
            <br>
            <div th:if="${empty}" class="alert alert-warning">

                <h6 th:text="'Aucun colis trouvé avec cette référence :'+${num}"></h6>
            </div>
        </div>

        <div th:if="${douaneList != null and !douaneList.isEmpty()}" class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>Numéro</th>
                        <th>Bloc</th>
                        <th>Nombre</th>
                        <th>Poids (kg)</th>
                        <th>Destinataire</th>
                        <th>Origine</th>
                        <th>Date arrivée</th>
                        <th>Sans facture</th>
                        <th>Etat</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="douane : ${douaneList}">
                        <td th:text="${douane.numColis}"></td>
                        <td th:text="${douane.bloc + (douane.nbColis > 1 ? ' - ' + (douane.bloc + douane.nbColis - 1) : '')}"></td>                <td th:text="${douane.numColis.toUpperCase()}"></td>
                        <td th:text="${douane.nbColis}"></td>
                        <td th:text="${douane.poid}"></td>
                        <td th:text="${douane.nom}"></td>
                        <td th:text="${douane.origin}"></td>
                        <td th:text="${douane.dateArrivee}"></td>
                        <td>
                            <input type="checkbox" disabled
                                   th:checked="${douane.observation == 'Sans facture'}"
                                   class="form-check-input">
                        </td>
                        <td>
    <span th:if="${reprintdelivered}" class="badge bg-success">
        <i class="bi bi-check-circle-fill"></i> Livré
    </span>
                            <span th:unless="${reprintdelivered}" class="badge bg-warning text-dark">
        <i class="bi bi-clock-fill"></i> En attente
    </span>
                        </td>                        <td>
                            <!-- Bouton d'impression pour chaque ligne -->
                            <div th:if="${reprintdelivered}">
                                <a target="_blank"
                                   class="btn btn-success btn-sm btn-print"
                                   th:href="@{/reprintdelivered(colis=${douane.numColis})}"
                                   title="Imprimer ce colis">
                                    <i class="bi bi-printer-fill"></i> Imprimer
                                </a>
                            </div>
                            <div th:if="${reprintnotdelivered}">
                                <a target="_blank"
                                   class="btn btn-success btn-sm btn-print"
                                   th:href="@{/reprintnotdelivered(colis=${douane.numColis})}"
                                   title="Imprimer ce colis">
                                    <i class="bi bi-printer-fill"></i> Imprimer
                                </a>
                            </div>


                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Messages d'état -->
            <div class="row mt-3">
                <div class="col-12">
                    <div class="alert alert-danger text-center" th:if="${exist}">
                        Colis déjà existant
                    </div>
                    <div class="alert alert-success text-center" th:if="${success}">
                        Ajouté avec succès
                    </div>
                </div>
            </div>
        </div>

        <!-- Message si la liste est vide -->
        <div th:if="${douaneList == null or douaneList.isEmpty()}" class="card-body">
            <div class="alert alert-info text-center">
                <i class="bi bi-info-circle"></i> Aucun colis trouvé
            </div>
        </div>
    </div>
</div>
</body>
</html>
